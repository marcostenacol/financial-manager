services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://financial:financial@db:5432/financial
      REDIS_URL: redis://cache:6379
      JWT_SECRET: ${JWT_SECRET:-super-secret-key}
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - financial-network

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: financial
      POSTGRES_USER: financial
      POSTGRES_PASSWORD: financial
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financial -d financial"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./docker/postgres:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    networks:
      - financial-network

  cache:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./docker/redis:/usr/local/etc/redis
      - redis_data:/data
    networks:
      - financial-network

networks:
  financial-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
