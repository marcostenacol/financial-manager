services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    profiles: ["homolog", "main"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:central_password@central-db:5432/financial_db?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://cache:6379}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT:-3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    depends_on:
      cache:
        condition: service_healthy
    networks:
      - shared-network

  cache:
    image: redis:7-alpine
    profiles: ["homolog", "main"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - shared-network

  db:
    image: postgres:16-alpine
    profiles: ["homolog"]
    container_name: financial_homolog_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-financial_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shared-network

networks:
  shared-network:
    external: true

volumes:
  redis_data:
